name: sime

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_backend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sime_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sime_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      AI_SERVICE_URL: http://worker-api:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-app_backend}:${POSTGRES_PASSWORD:-sime_dev_password}@db:5432/${POSTGRES_DB:-sime_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-1234567890}
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-local-dev-worker-secret-change-me-1234567890}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-15000}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-512}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-15000}
    command: sh -c "npm run prisma:migrate && npm run db:seed && npm start"
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ./worker
    environment:
      REDIS_URL: redis://redis:6379
      BACKEND_URL: http://backend:4000
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-local-dev-worker-secret-change-me-1234567890}
      PITCH_MODEL: ${PITCH_MODEL:-auto}
      DEVICE: ${DEVICE:-auto}
      POLL_TIMEOUT: ${POLL_TIMEOUT:-5}
      SWIFTF0_CONFIDENCE: ${SWIFTF0_CONFIDENCE:-0.9}
      RMVPE_MODEL_PATH: ${RMVPE_MODEL_PATH:-}
      RMVPE_THRESHOLD: ${RMVPE_THRESHOLD:-0.03}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-api:
    build:
      context: ./worker
    command: uvicorn worker.api:app --host 0.0.0.0 --port 8000
    environment:
      REDIS_URL: redis://redis:6379
      BACKEND_URL: http://backend:4000
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-local-dev-worker-secret-change-me-1234567890}
      PITCH_MODEL: ${PITCH_MODEL:-auto}
      DEVICE: ${DEVICE:-auto}
      SWIFTF0_CONFIDENCE: ${SWIFTF0_CONFIDENCE:-0.9}
      RMVPE_MODEL_PATH: ${RMVPE_MODEL_PATH:-}
      RMVPE_THRESHOLD: ${RMVPE_THRESHOLD:-0.03}
    ports:
      - "${WORKER_API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_WS_URL: ${NEXT_PUBLIC_BACKEND_WS_URL:-ws://localhost:4000}
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:4000
      NEXT_PUBLIC_BACKEND_WS_URL: ${NEXT_PUBLIC_BACKEND_WS_URL:-ws://localhost:4000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
